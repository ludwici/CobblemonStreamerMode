name: Build and publish Fabric

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Fabric to CurseForge
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build Fabric JAR
        run: gradle :fabric:build --no-daemon
      - name: Verify bundled Twitch4J
        shell: bash
        run: |
          shopt -s nullglob
          jars=(fabric/build/libs/cobblemon_streamer_mode-fabric-*.jar)
          found=0
          for file in "${jars[@]}"; do
            case "$file" in
              *-dev.jar|*-dev-shadow.jar|*-sources.jar|*-javadoc.jar) continue ;;
            esac
            jar tf "$file" > "$RUNNER_TEMP/fabric-jar-contents.txt"
            grep -Fx 'com/github/philippheuer/credentialmanager/domain/OAuth2Credential.class' "$RUNNER_TEMP/fabric-jar-contents.txt"
            grep -Fx 'com/github/twitch4j/TwitchClientBuilder.class' "$RUNNER_TEMP/fabric-jar-contents.txt"
            grep -Fx 'com/github/twitch4j/helix/TwitchHelix.class' "$RUNNER_TEMP/fabric-jar-contents.txt"
            mkdir -p artifacts
            cp "$file" artifacts/
            found=1
          done
          test "$found" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-streamer-mode-fabric
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/download-artifact@v4
        with:
          name: cobblemon-streamer-mode-fabric
          path: publishing/artifacts
      - name: Check publishing token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CURSEFORGE_TOKEN"
      - name: Validate publication
        run: gradle -p publishing publishMods -PpublishDryRun=true --no-daemon --stacktrace
      - name: Publish Fabric to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: gradle -p publishing publishMods --no-daemon --stacktrace
